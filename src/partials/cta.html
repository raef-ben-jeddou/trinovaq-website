<!-- ================= FINAL CTA ================= -->
<section class="cta-final" id="contact">
  <div class="wrap">
    <p class="eyebrow reveal">
      <i class="dotg" aria-hidden="true"></i>
      Get started
    </p>
    <h2 class="reveal">Secure by design. Compliant by default.</h2>
    <p class="lede reveal d1">See what TrinovaQ finds in your codebase. Tell us where to reach you and we will set up a demo on your own examples.</p>
    <form class="demo-form reveal d2" id="demoForm" novalidate>
      <div class="frow">
        <label>Name<input type="text" name="name" required autocomplete="name" placeholder="Your name"></label>
        <label>Work email<input type="email" name="email" required autocomplete="email" placeholder="you@company.com"></label>
      </div>
      <div class="frow">
        <label>Company<input type="text" name="company" autocomplete="organization" placeholder="Company"></label>
        <label>Role<input type="text" name="role" autocomplete="organization-title" placeholder="Role"></label>
      </div>
      <label>Message<textarea name="message" rows="3" placeholder="What would you like to see?"></textarea></label>
      <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="factions">
        <button class="btn" type="submit" id="demoSubmit">Request a demo</button>
        <span class="fstatus" id="formStatus" role="status" aria-live="polite"></span>
      </div>
    </form>
    <span class="mail reveal d3">or write to us: <a href="mailto:Contact@trinovaq.io">Contact@trinovaq.io</a></span>
  </div>
</section>
